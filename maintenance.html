<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="10">
<title>Top Ten — Deploying</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f1120;color:#e6e7f0;text-align:center;padding:1rem}
.card{max-width:440px}
.badge{display:inline-block;padding:.35rem .75rem;border-radius:999px;background:rgba(124,92,255,.15);color:#a692ff;font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;margin-bottom:1.25rem}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.03em;margin-bottom:.75rem}
p{color:#8f92aa;line-height:1.5;margin-bottom:.5rem}
.sub{font-size:.8rem;color:#5f6182;margin-top:1rem}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7c5cff;margin:0 3px;animation:pulse 1.4s ease-in-out infinite both}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.3}40%{opacity:1}}
</style>
</head>
<body>
<div class="card">
<div class="badge">Deploying</div>
<h1>We'll be right back</h1>
<p>Top Ten is updating with the latest changes. This usually takes under a minute.</p>
<p><span class="dot"></span><span class="dot"></span><span class="dot"></span></p>
<p class="sub">This page will refresh automatically.</p>
</div>
</body>
</html>
